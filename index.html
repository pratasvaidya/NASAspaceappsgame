<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="A kid-friendly Mars base survival game that uses real NASA space-weather data (DONKI).">
  <title>Mars Outpost Survival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="haze"></div>
  <div id="vignette"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="pill sol"><span id="solNum">Sol 1</span><small id="solOf">of 10</small></div>
      <div class="pill clock" id="clockBox">
        <span id="clock">1:30</span><small id="phaseLabel">Briefing</small>
      </div>
      <div class="bars">
        <div class="bar" data-res="power"><span class="ico">:lightning:</span><div class="track"><div class="fill"></div><span class="lbl">Power</span><b class="val">100</b></div></div>
        <div class="bar" data-res="oxygen"><span class="ico">:wind:</span><div class="track"><div class="fill"></div><span class="lbl">Oxygen</span><b class="val">100</b></div></div>
        <div class="bar" data-res="food"><span class="ico">:orange:</span><div class="track"><div class="fill"></div><span class="lbl">Food</span><b class="val">100</b></div></div>
      </div>
    </div>
    <div id="objective"></div>
    <div id="status"></div>
  </div>

  <button id="mute" type="button"></button>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="act" type="button">SPACE</button>
  </div>

  <button id="skipTut" hidden>:fast-forward: Skip training</button>

  <div id="banner" hidden></div>
  <div id="toast" hidden></div>

  <div id="modal-backdrop" hidden>
    <div id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="loading">Loading Mars…</div>
  <div id="fatal" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="icons.js"></script>
  <script src="scenery.js"></script>
  <script src="game.js"></script>
</body>
</html>
